# Mosquitto broker — configuracao para o servico de localizacao (trilha)
# Versao compativel com Mosquitto 2.x

# -----------------------------------------------------------------------
# DEV: acesso anonimo habilitado para facilitar o desenvolvimento local.
# Em producao, comente "allow_anonymous true" e habilite as secoes abaixo.
# -----------------------------------------------------------------------

listener 1883
allow_anonymous true

# -----------------------------------------------------------------------
# PRODUCAO: descomente e configure os caminhos abaixo
# -----------------------------------------------------------------------
# allow_anonymous false
#
# Arquivo de senhas (gerado com: mosquitto_passwd -c /etc/mosquitto/passwd <username>)
# password_file /etc/mosquitto/passwd
#
# Arquivo de ACL (Access Control List)
# acl_file /etc/mosquitto/acl
#
# Logs detalhados
# log_dest file /var/log/mosquitto/mosquitto.log
# log_type error
# log_type warning
# log_type notice
# log_type information
# log_timestamp true
#
# Limite de mensagens por conexao (protecao contra abuso)
# max_inflight_messages 10
# max_queued_messages 100
#
# Persistencia de sessao (QoS 1 sobrevive a reinicializacoes)
# persistence true
# persistence_location /var/lib/mosquitto/
