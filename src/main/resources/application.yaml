spring:
  application:
    name: loc

  datasource:
    url: jdbc:postgresql://localhost:5432/trilha_localizacao
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Dev: Hibernate cria/atualiza tabelas. Producao: trocar para 'validate'
      # e gerar o baseline do schema via Flyway.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Pub/Sub usado como ponte do tempo real (localizacao ao vivo) entre instancias.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8082

# Ingestao da telemetria GPS. O app mobile publica os pontos no broker e o
# servico consome. QoS 1 + buffer no cliente cobrem o sinal fraco da trilha.
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:loc-consumer}
  topico: ${MQTT_TOPICO:localizacao/ponto}
  qos: ${MQTT_QOS:1}
